<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2f3437"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#d8dcde" stroke-width="1"/>
    </pattern>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #202426; }
      .title { font-size: 38px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #565d61; }
      .section { font-size: 25px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 15px; fill: #565d61; }
      .angle { font-size: 22px; font-weight: 700; text-anchor: middle; }
      .formula { font-family: "Cambria Math", "Times New Roman", serif; font-size: 24px; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f7f8f6"/>
  <rect x="0" y="0" width="1600" height="116" fill="#ffffff"/>
  <rect x="0" y="112" width="1600" height="4" fill="#e85d4a"/>
  <text x="70" y="60" class="title">四张偏振图是怎样从一帧图像得到的？</text>
  <text x="72" y="94" class="subtitle">微偏振阵列相机：同一时刻、四种线偏振分析方向、相邻但并非完全相同的空间采样</text>

  <!-- Step 1 -->
  <text x="72" y="164" class="section">1  入射光</text>
  <rect x="70" y="190" width="300" height="330" rx="6" fill="#ffffff" stroke="#cdd2d4" stroke-width="2"/>
  <circle cx="220" cy="315" r="70" fill="#fff4cf" stroke="#e3a82b" stroke-width="3"/>
  <g stroke="#e3a82b" stroke-width="5" stroke-linecap="round">
    <line x1="220" y1="217" x2="220" y2="246"/><line x1="220" y1="384" x2="220" y2="413"/>
    <line x1="122" y1="315" x2="151" y2="315"/><line x1="289" y1="315" x2="318" y2="315"/>
    <line x1="151" y1="246" x2="171" y2="266"/><line x1="269" y1="364" x2="289" y2="384"/>
    <line x1="151" y1="384" x2="171" y2="364"/><line x1="269" y1="266" x2="289" y2="246"/>
  </g>
  <g transform="translate(220 315)" stroke="#e85d4a" stroke-width="4" marker-end="url(#arrow)">
    <line x1="0" y1="0" x2="46" y2="-27"/>
  </g>
  <text x="220" y="446" text-anchor="middle" class="body" font-weight="700">自然场景通常是部分偏振光</text>
  <text x="220" y="478" text-anchor="middle" class="small">可看成“无偏振分量 + 线偏振分量”</text>

  <line x1="384" y1="352" x2="443" y2="352" stroke="#2f3437" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <text x="438" y="164" class="section">2  2×2 微偏振单元</text>
  <rect x="435" y="190" width="365" height="330" rx="6" fill="#ffffff" stroke="#cdd2d4" stroke-width="2"/>
  <g transform="translate(503 228)">
    <rect x="0" y="0" width="112" height="112" fill="#d8f0ef" stroke="#2a7774" stroke-width="3"/>
    <rect x="112" y="0" width="112" height="112" fill="#fff0d4" stroke="#ad7213" stroke-width="3"/>
    <rect x="0" y="112" width="112" height="112" fill="#f6ddda" stroke="#a8473a" stroke-width="3"/>
    <rect x="112" y="112" width="112" height="112" fill="#e5eadb" stroke="#607c3c" stroke-width="3"/>
    <g stroke="#202426" stroke-width="5" stroke-linecap="round">
      <line x1="56" y1="25" x2="56" y2="87"/>
      <line x1="135" y1="89" x2="201" y2="23"/>
      <line x1="22" y1="201" x2="90" y2="133"/>
      <line x1="137" y1="168" x2="199" y2="168"/>
    </g>
    <text x="56" y="105" class="angle">90°</text>
    <text x="168" y="105" class="angle">45°</text>
    <text x="56" y="217" class="angle">135°</text>
    <text x="168" y="217" class="angle">0°</text>
  </g>
  <text x="617" y="474" text-anchor="middle" class="body">每个像素前方只有一个分析器方向</text>
  <text x="617" y="502" text-anchor="middle" class="small">工程代码中的实际排列与上图一致</text>

  <line x1="814" y1="352" x2="873" y2="352" stroke="#2f3437" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <text x="868" y="164" class="section">3  原始马赛克单帧</text>
  <rect x="865" y="190" width="300" height="330" rx="6" fill="#ffffff" stroke="#cdd2d4" stroke-width="2"/>
  <g transform="translate(915 228)">
    <rect width="200" height="200" fill="url(#grid)" stroke="#747b7e" stroke-width="2"/>
    <g opacity="0.82">
      <g fill="#85c7c3"><rect x="0" y="0" width="40" height="40"/><rect x="80" y="0" width="40" height="40"/><rect x="160" y="0" width="40" height="40"/><rect x="0" y="80" width="40" height="40"/><rect x="80" y="80" width="40" height="40"/><rect x="160" y="80" width="40" height="40"/><rect x="0" y="160" width="40" height="40"/><rect x="80" y="160" width="40" height="40"/><rect x="160" y="160" width="40" height="40"/></g>
      <g fill="#edbf69"><rect x="40" y="0" width="40" height="40"/><rect x="120" y="0" width="40" height="40"/><rect x="40" y="80" width="40" height="40"/><rect x="120" y="80" width="40" height="40"/><rect x="40" y="160" width="40" height="40"/><rect x="120" y="160" width="40" height="40"/></g>
      <g fill="#dc8c81"><rect x="0" y="40" width="40" height="40"/><rect x="80" y="40" width="40" height="40"/><rect x="160" y="40" width="40" height="40"/><rect x="0" y="120" width="40" height="40"/><rect x="80" y="120" width="40" height="40"/><rect x="160" y="120" width="40" height="40"/></g>
      <g fill="#aabe86"><rect x="40" y="40" width="40" height="40"/><rect x="120" y="40" width="40" height="40"/><rect x="40" y="120" width="40" height="40"/><rect x="120" y="120" width="40" height="40"/></g>
    </g>
    <rect width="200" height="200" fill="url(#grid)"/>
  </g>
  <text x="1015" y="474" text-anchor="middle" class="body">一帧里交错记录四种强度 Iθ</text>
  <text x="1015" y="502" text-anchor="middle" class="small">相邻像素位置相差 1 个原始像素</text>

  <line x1="1179" y1="352" x2="1238" y2="352" stroke="#2f3437" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <text x="1230" y="164" class="section">4  解复用为四图</text>
  <rect x="1225" y="190" width="305" height="330" rx="6" fill="#ffffff" stroke="#cdd2d4" stroke-width="2"/>
  <g transform="translate(1260 222)">
    <g><rect width="105" height="105" fill="#d8f0ef" stroke="#2a7774" stroke-width="3"/><line x1="53" y1="18" x2="53" y2="72" stroke="#202426" stroke-width="5"/><text x="53" y="96" class="angle">I90</text></g>
    <g transform="translate(135 0)"><rect width="105" height="105" fill="#fff0d4" stroke="#ad7213" stroke-width="3"/><line x1="25" y1="72" x2="80" y2="17" stroke="#202426" stroke-width="5"/><text x="53" y="96" class="angle">I45</text></g>
    <g transform="translate(0 130)"><rect width="105" height="105" fill="#f6ddda" stroke="#a8473a" stroke-width="3"/><line x1="25" y1="17" x2="80" y2="72" stroke="#202426" stroke-width="5"/><text x="53" y="96" class="angle">I135</text></g>
    <g transform="translate(135 130)"><rect width="105" height="105" fill="#e5eadb" stroke="#607c3c" stroke-width="3"/><line x1="25" y1="45" x2="80" y2="45" stroke="#202426" stroke-width="5"/><text x="53" y="96" class="angle">I0</text></g>
  </g>
  <text x="1377" y="490" text-anchor="middle" class="small">每幅图宽、高各为原始帧的 1/2</text>

  <!-- Principle band -->
  <rect x="70" y="570" width="1460" height="174" rx="6" fill="#ffffff" stroke="#cdd2d4" stroke-width="2"/>
  <text x="100" y="614" class="section">核心物理：线偏振片只让沿其透振轴的电场分量通过</text>
  <text x="105" y="661" class="formula">完全线偏振光： Iθ = Imax cos²(α − θ)</text>
  <text x="105" y="708" class="formula">一般部分偏振光： Iθ = ½ [ S0 + S1 cos(2θ) + S2 sin(2θ) ]</text>
  <g transform="translate(930 594)">
    <line x1="0" y1="74" x2="170" y2="74" stroke="#607c3c" stroke-width="8"/>
    <text x="85" y="112" text-anchor="middle" class="small">分析器轴 θ</text>
    <line x1="84" y1="74" x2="158" y2="22" stroke="#e85d4a" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M130 74 A46 46 0 0 0 122 47" fill="none" stroke="#e3a82b" stroke-width="4"/>
    <text x="139" y="52" class="body" fill="#ad7213">α−θ</text>
    <text x="193" y="28" class="small">入射线偏振方向 α</text>
  </g>

  <!-- Warnings -->
  <rect x="70" y="780" width="710" height="160" rx="6" fill="#fff5e6" stroke="#d59b34" stroke-width="2"/>
  <text x="98" y="824" class="section" fill="#875b12">为什么四张图亮暗不同？</text>
  <text x="100" y="864" class="body">某处的偏振方向越接近分析器角度，该通道越亮；相差 90° 时最暗。</text>
  <text x="100" y="900" class="body">无偏振光理想情况下四通道相等，因此“亮暗差”承载偏振信息。</text>

  <rect x="820" y="780" width="710" height="160" rx="6" fill="#eef6f4" stroke="#4c8c84" stroke-width="2"/>
  <text x="848" y="824" class="section" fill="#2a6861">工程上必须留意</text>
  <text x="850" y="864" class="body">四通道来自不同像素位置：物体边缘会产生伪偏振，需插值、配准或降采样。</text>
  <text x="850" y="900" class="body">还应做暗场、平场、通道增益与消光比标定，再计算偏振量。</text>
</svg>
